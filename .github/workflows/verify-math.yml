name: gates

# Gates automáticos da matriz MARIAH (plano INAEP, Fase 4). Um gate vermelho
# bloqueia o merge. NÃO substituem o gate tripartite (guia × app × revisor),
# mas garantem que dados, verificação, paridade numérica e paridade de
# enunciados nunca divirjam num commit.
#   - verify : estrutura, cortes, efeitos v2, M3, condicionais (verify-math)
#   - parity : enunciados spec × guia v46 (camada de strings — M1)
#   - gate   : 31 vetores B + 33 V17 app × planilha camada 2 (Δ=0)

on:
  push:
    branches: [main]
    paths:
      - 'src/components/maria/data.ts'
      - 'src/components/maria/utils.ts'
      - 'scripts/verify-math.ts'
      - 'scripts/parity-check.ts'
      - 'scripts/gate-run.ts'
      - 'spec/**'
      - 'gate/**'
  pull_request:
    paths:
      - 'src/components/maria/data.ts'
      - 'src/components/maria/utils.ts'
      - 'scripts/verify-math.ts'
      - 'scripts/parity-check.ts'
      - 'scripts/gate-run.ts'
      - 'spec/**'
      - 'gate/**'

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify
      - run: npm run parity
      - run: npm run gate
