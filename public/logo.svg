<?xml version="1.0" encoding="utf-8"?>
<!--
  MARIAH — favicon.
  Quadrado arredondado em azul marinho gov.br (cor primária do app) com a letra "M"
  em traço branco bold, projetada para legibilidade em 16x16 px na aba
  do navegador. O ícone de escudo continua no cabeçalho da página.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo azul marinho gov.br (#0C2C56) — cor primária institucional -->
  <rect width="64" height="64" rx="12" fill="#0C2C56"/>
  <!-- Letra "M" em traço branco bold, centralizada -->
  <path d="M 16 48 L 16 16 L 32 32 L 48 16 L 48 48"
        stroke="#ffffff"
        stroke-width="8"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
